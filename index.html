<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>AirFlow</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#fff;background:#050505}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 94%,#33000c 0%,#090609 42%,#050505 76%)}button,input{font:inherit}button{cursor:pointer;border:0}main{max-width:490px;min-height:100dvh;margin:auto;padding:36px 24px 28px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:800;letter-spacing:-.9px}.logo{width:45px;height:46px;position:relative;display:inline-block;filter:drop-shadow(0 5px 7px #f00a)}.logo i{position:absolute;display:block;border-top:9px solid #f91a39;border-left:9px solid #d50829;border-radius:40px 36px 5px 26px;transform:rotate(-13deg)}.logo i:nth-child(1){width:41px;height:30px;top:5px;left:2px}.logo i:nth-child(2){width:29px;height:22px;top:16px;left:8px}.logo i:nth-child(3){width:16px;height:13px;top:28px;left:14px;border-width:8px}.settings{border-radius:50%;height:42px;width:42px;background:#17171a;color:#ddd;font-size:22px}.intro{text-align:center;margin:54px 0 6px}.intro .logo{transform:scale(1.55);margin:20px}.intro h1{font-size:30px;letter-spacing:-1px;margin:22px 0 5px}.muted{color:#a5a4aa}.intro p{margin:0;font-size:14px}.radar{position:relative;aspect-ratio:1;width:min(100%,330px);margin:24px auto 18px;display:grid;place-items:center;border-radius:50%;background:repeating-radial-gradient(circle at center,transparent 0px,transparent 50px,#ee19363d 51px,#ee19363d 52px,transparent 53px,transparent 60px),radial-gradient(circle,#6a071629 0%,#2e00071c 48%,transparent 72%)}.radar:after{content:"";width:14px;height:14px;border-radius:50%;background:#ff183b;box-shadow:0 0 16px #ff143c}.pulse{position:absolute;inset:15%;border:1px solid #ff244450;border-radius:50%;animation:pulse 3s infinite}@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.45);opacity:0}}.device-row{display:flex;justify-content:center;gap:20px;text-align:center;min-height:115px}.device{background:none;color:#fff;max-width:105px;min-width:84px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:7px}.device-icon{display:grid;place-items:center;width:67px;height:67px;border-radius:50%;background:linear-gradient(145deg,#28282b,#111113);border:1px solid #3b3b40;font-size:30px}.device strong{font-size:12px;overflow-wrap:anywhere}.device small{font-size:10px;color:#aaa}.section{margin-top:auto;background:#161619;border:1px solid #29292d;border-radius:23px;padding:19px;margin-bottom:14px}.section h2{font-size:15px;margin:0 0 10px}.row{display:flex;gap:9px}.code{font-size:20px;font-weight:800;letter-spacing:2px;color:#ff3b55;margin:8px 0 15px}.action{background:#f71135;color:#fff;border-radius:15px;padding:14px 18px;font-weight:700}.subtle{background:#333337}.full{width:100%}input[type=text]{min-width:0;width:100%;background:#09090c;border:1px solid #414147;border-radius:13px;padding:12px;color:#fff;text-transform:uppercase}.upload{display:block;text-align:center;border:1px dashed #803b47;padding:19px;border-radius:14px;margin:12px 0;cursor:pointer;color:#ddd}.upload input{display:none}#status,#transfer{font-size:12px;line-height:1.5;color:#aaa;min-height:18px}#received a{color:#ff667a;display:block;margin-top:12px;overflow-wrap:anywhere}progress{width:100%;accent-color:#ff1740}.overlay{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}.overlay.visible{display:flex}.modal{width:min(100%,420px);background:#1b1b20;border:1px solid #3d3035;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 25px 100px #000}.modal h2{font-size:23px}.modal p{line-height:1.5;color:#bbb}.preview{height:125px;border-radius:16px;background:linear-gradient(140deg,#270b37,#9c214b,#111a42);display:grid;place-items:center;font-size:50px;margin:18px auto}.modal .row button{flex:1}footer{text-align:center;color:#777;font-size:11px;padding:5px 0 10px}@media(max-height:800px){.intro{margin-top:18px}.radar{width:min(100%,235px);margin:8px auto}.section{margin-top:15px}}
</style></head><body><main><header><div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>AirFlow</div><button class="settings" id="settings" aria-label="Verbindingsinstellingen">⚙</button></header><div class="intro"><div class="logo" aria-hidden="true"><i></i><i></i><i></i></div><h1>Deel zonder grenzen.</h1><p class="muted" id="headline">Zoekt naar apparaten in de buurt…</p></div><div class="radar" aria-label="Radarillustratie"><div class="pulse"></div></div><div class="device-row" id="devices"><button class="device" id="manual"><span class="device-icon">＋</span><strong>Apparaat verbinden</strong><small>Via code</small></button></div><section class="section" id="connection"><h2>Verbind een apparaat</h2><div class="muted" style="font-size:12px">Jouw apparaatcode</div><div class="row" style="align-items:center"><div class="code" id="mycode">Laden…</div><button class="action subtle" id="copy" style="margin-left:auto;padding:9px 12px">Kopieer</button></div><div class="row"><input id="target" type="text" placeholder="AF-XXXXXX" aria-label="Code van ander apparaat"><button class="action" id="connect">Verbind</button></div><p id="status">Start de app op beide apparaten en vul de andere code in.</p></section><section class="section" id="share" style="display:none"><h2>Bestanden delen</h2><label class="upload">＋ Kies foto's of bestanden<input type="file" id="files" multiple></label><button class="action full" id="send">Verstuur bestanden</button><progress id="progress" value="0" max="100" hidden></progress><p id="transfer"></p><div id="received"></div></section><footer>AirFlow testversie · Voor verbinding is internet nodig</footer></main><div class="overlay" id="request"><div class="modal"><div class="logo" aria-hidden="true"><i></i><i></i><i></i></div><h2>Verbindingsverzoek</h2><p id="request-text"></p><div class="row"><button class="action subtle" id="reject">Weiger</button><button class="action" id="accept">Accepteer</button></div></div></div><div class="overlay" id="incoming"><div class="modal"><div class="logo" aria-hidden="true"><i></i><i></i><i></i></div><h2>Bestand ontvangen</h2><p id="incoming-text"></p><div class="preview">📷</div><div class="row"><button class="action subtle" id="denyfile">Weiger</button><button class="action" id="acceptfile">Accepteer</button></div></div></div><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let peer,conn,incoming=null,allowed=false;const id='AF-'+Math.random().toString(36).slice(2,8).toUpperCase();$('mycode').textContent=id;const status=s=>$('status').textContent=s;const show=id=>$(id).classList.add('visible'),hide=id=>$(id).classList.remove('visible');$('settings').onclick=()=>document.getElementById('connection').scrollIntoView({behavior:'smooth'});$('manual').onclick=()=>document.getElementById('connection').scrollIntoView({behavior:'smooth'});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(id);$('copy').textContent='Gekopieerd'}catch{status('Selecteer de code om hem te kopiëren.')}};if(!window.Peer){status('Verbindingsdienst niet beschikbaar. Controleer internet.');return;}peer=new Peer(id);peer.on('open',()=>status('Klaar om te verbinden.'));peer.on('error',e=>status('Verbindingsfout: '+e.type));peer.on('disconnected',()=>status('Signaalserver niet bereikbaar.'));peer.on('connection',c=>{if(conn?.open){c.close();return;}attach(c);$('request-text').textContent=c.peer+' wil verbinding maken.';show('request');$('accept').onclick=()=>{hide('request');allowed=true;if(c.open)activate(c);else status('Verbindingsverzoek geaccepteerd. Wachten…')};$('reject').onclick=()=>{hide('request');c.close()}});function activate(c){$('headline').textContent='Verbonden met '+c.peer;$('devices').innerHTML='';const b=document.createElement('button');b.className='device';b.innerHTML='<span class="device-icon">📱</span><strong></strong><small>Verbonden</small>';b.querySelector('strong').textContent=c.peer;$('devices').append(b);$('share').style.display='block';status('Verbonden met '+c.peer)}function attach(c){conn=c;c.on('open',()=>{if(allowed)activate(c);else status('Verbinding geopend. Wacht op acceptatie.')});c.on('close',()=>{$('headline').textContent='Niet verbonden';$('share').style.display='none';status('Verbinding verbroken.');allowed=false});c.on('error',()=>status('Verbinding mislukt.'));c.on('data',receive)}$('connect').onclick=()=>{const target=$('target').value.trim().toUpperCase();if(!target||target===id){status('Vul de code van het andere apparaat in.');return;}allowed=true;status('Verbinden…');attach(peer.connect(target,{reliable:true,serialization:'binary'}))};function receive(m){if(!allowed||!m||typeof m!=='object')return;if(m.kind==='start'){if(incoming)return;if(!Number.isSafeInteger(m.size)||m.size<0||m.size>250*1024*1024){status('Ongeldig bestand of groter dan 250 MB.');return;}incoming={name:String(m.name||'bestand'),type:String(m.type||'application/octet-stream'),size:m.size,parts:[],bytes:0,accepted:false};$('incoming-text').textContent=conn.peer+' wil '+incoming.name+' met je delen.';show('incoming');$('acceptfile').onclick=()=>{if(!incoming)return;incoming.accepted=true;hide('incoming');conn.send({kind:'accept-file'});if(incoming.size===0)finish()};$('denyfile').onclick=()=>{incoming=null;hide('incoming');conn.send({kind:'reject-file'})}}else if(m.kind==='chunk'&&incoming?.accepted){const a=m.data instanceof ArrayBuffer?new Uint8Array(m.data):new Uint8Array(m.data);incoming.parts.push(a);incoming.bytes+=a.byteLength;if(incoming.bytes>incoming.size){incoming=null;status('Bestandsgrootte klopt niet.');return;}if(incoming.bytes===incoming.size)finish()}else if(m.kind==='accept-file'&&waiting){waiting(true)}else if(m.kind==='reject-file'&&waiting){waiting(false)}}function finish(){const f=incoming;incoming=null;const blob=new Blob(f.parts,{type:f.type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=f.name;a.textContent='↓ Download '+f.name;$('received').prepend(a);$('transfer').textContent='Bestand ontvangen. Tik op Download.';setTimeout(()=>URL.revokeObjectURL(url),3600000)}let waiting=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));$('send').onclick=async()=>{if(!conn?.open||!allowed||!$('files').files.length){$('transfer').textContent='Selecteer eerst een bestand.';return;}$('send').disabled=true;$('progress').hidden=false;try{for(const f of $('files').files){if(f.size>250*1024*1024)throw Error('Maximaal 250 MB per bestand');conn.send({kind:'start',name:f.name,type:f.type,size:f.size});const ok=await Promise.race([new Promise(resolve=>waiting=resolve),sleep(60000).then(()=>false)]);waiting=null;if(!ok){$('transfer').textContent='Bestand geweigerd of verzoek verlopen.';continue;}for(let offset=0;offset<f.size;offset+=16384){if(!conn.open)throw Error('Verbinding verbroken');const chunk=await f.slice(offset,offset+16384).arrayBuffer();conn.send({kind:'chunk',data:chunk});$('progress').value=Math.round((offset+chunk.byteLength)/f.size*100);$('transfer').textContent='Versturen: '+f.name+' ('+$('progress').value+'%)';while(conn.dataChannel?.bufferedAmount>524288)await sleep(40);await sleep(5)}$('transfer').textContent='Verzonden: '+f.name}}catch(e){$('transfer').textContent='Fout: '+e.message}finally{$('send').disabled=false}}})();
</script></body></html>
